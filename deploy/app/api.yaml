# The projects API: a stateless Deployment behind a Service.
#
# The cluster supplies what this directory does not create:
#
# - A ConfigMap named projects-settings, holding the settings README.md lists
#   as environment variables, all but the Postgres login and WEB_CLIENT_SECRET.
# - A Secret named postgres-app, holding the Postgres login as POSTGRES_HOST,
#   POSTGRES_PORT, POSTGRES_USERNAME, POSTGRES_PASSWORD and POSTGRES_DB. Its
#   role needs SELECT, INSERT, UPDATE and DELETE on every table and USAGE on
#   every sequence, including those a later migration creates, and nothing
#   that changes the schema. The migration Job alone logs in as the owner. A
#   role named for the database with _app after it loses UPDATE and DELETE on
#   audit_trail to a migration, so it appends there and rewrites nothing.
# - A Secret named projects-settings, holding WEB_CLIENT_SECRET. Without it the
#   API logs no browser in, and only a bearer token reaches it.
# - No route of its own. projects-web, in web.yaml, passes /api and
#   /.well-known here from the app's host, whose address PUBLIC_URL names.
# - Each NetworkPolicy the pod reaches Postgres and the issuer through, and the
#   one letting projects-web reach it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: projects-api
  labels:
    app.kubernetes.io/instance: projects-api
    app.kubernetes.io/component: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: projects-api
  labels:
    app.kubernetes.io/instance: projects-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: projects
    app.kubernetes.io/instance: projects-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projects-api
  labels:
    app.kubernetes.io/instance: projects-api
    app.kubernetes.io/component: api
  annotations:
    kubernetes.io/description: The projects HTTP API, serving /api/v1 to its clients over Postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: projects
      app.kubernetes.io/instance: projects-api
  # The new pod is ready before the old one stops, so a release drops no requests.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: projects-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: projects-api
      automountServiceAccountToken: false
      # Service links would put POSTGRES_PORT=tcp://<ip>:5432 in the environment
      # wherever a Service named postgres shares the namespace, and the API reads
      # POSTGRES_PORT as a number.
      enableServiceLinks: false
      # The image's numeric USER is the uid, so runAsNonRoot can check it.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Covers the preStop sleep plus drainTimeout in api/main.go, with room to spare.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: projects
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: projects-settings
          # POSTGRES_PORT may be left out of the Secret, and then reads as 5432.
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_PORT
                  optional: true
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: POSTGRES_DB
            - name: WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: projects-settings
                  key: WEB_CLIENT_SECRET
                  optional: true
          # Endpoints drop a terminating pod a moment after TERM reaches it, so
          # the sleep keeps it accepting until no proxy routes to it.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # /ready answers 503 while Postgres or the identity provider does not,
          # which takes the pod out of the Service without restarting it.
          # timeoutSeconds outlasts readinessCheckDeadline in api/routes/routes.go.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # The room above the resident set is for a list answered to several clients
          # at once. The limit equals the request, so the pod never uses more memory
          # than the scheduler set aside for it.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
