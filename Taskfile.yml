version: "3"

vars:
  BINARY_NAME: projects
  BUILD_DIR: .
  # The release installs into ~/go/bin, so the dev build replaces it there and
  # the next release replaces the dev build. A copy in ~/.local/bin, which
  # precedes ~/go/bin on PATH, would hide every later release.
  INSTALL_DIR: "{{.HOME}}/go/bin"
  VERSION:
    sh: git describe --tags --always --dirty

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. The
  # module cache comes back from go.sum, and the web app's packages, which the
  # commit hooks run, from its lockfile. .envrc is linked from the primary
  # checkout, because a worktree without it runs against production data.
  # PRIMARY is derived from the shared git directory, so the link step no-ops in
  # the primary itself and wherever the primary has no .envrc.
  setup:
    desc: Make a fresh checkout runnable
    vars:
      PRIMARY:
        sh: git rev-parse --path-format=absolute --git-common-dir | sed 's|/\.git$||'
    cmds:
      - go mod download
      - npm ci --prefix web --no-audit --no-fund
      - |
        if [ "{{.PRIMARY}}" != "$PWD" ] && [ -f "{{.PRIMARY}}/.envrc" ]; then
          ln -sfn "{{.PRIMARY}}/.envrc" .envrc
          if command -v direnv >/dev/null; then direnv allow .; fi
        fi

  build:
    desc: Build the projects binary
    cmds:
      - echo "Building {{.BINARY_NAME}}..."
      - go build -ldflags "-s -w -X github.com/datapointchris/projects/cli.version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} .
      - echo "Build complete{{":"}} {{.BUILD_DIR}}/{{.BINARY_NAME}}"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY_NAME}}"

  test:
    desc: Run all tests
    cmds:
      - echo "Running tests..."
      - go test -v ./...
      - task: web:test

  web:test:
    desc: Run the web app's unit tests
    dir: web
    cmds:
      - npm run test:unit

  # The browser reaches the stack at http://localhost:8096, and the stand-in
  # identity provider logs every login in as one person. Its database lives in
  # a volume, so a stop that keeps the data is `docker compose stop`.
  dev-stack:start:
    desc: Build and start the web app's stack from this checkout, and wait until it serves
    cmds:
      - docker compose -f docker-compose.dev.yml up --build --wait
      - echo "Serving at http://localhost:8096"

  dev-stack:stop:
    desc: Stop the web app's stack and delete its database
    cmds:
      - docker compose -f docker-compose.dev.yml down -v

  # Vite reloads the page on every edit and sends /api to the running stack.
  web:dev:
    desc: Serve the web app from source at http://localhost:3002, against the stack
    deps:
      - dev-stack:start
    dir: web
    cmds:
      - npm run dev

  # One roundtrip through the stack the image ships in: the login, a project
  # named with a slash, and an item created, edited and deleted. It deletes the
  # stack afterwards, pass or fail.
  web:test:e2e:
    desc: Run the Playwright smoke against a fresh stack, then delete it
    cmds:
      - defer: docker compose -f docker-compose.dev.yml down -v
      - docker compose -f docker-compose.dev.yml down -v
      - docker compose -f docker-compose.dev.yml up --build --wait
      - cd web && npx playwright install chromium && npx playwright test

  install:
    desc: Build and install the dev build to ~/go/bin, where the release lives
    deps:
      - build
    cmds:
      - echo "Installing {{.BINARY_NAME}} to {{.INSTALL_DIR}}..."
      - mkdir -p {{.INSTALL_DIR}}
      - cp {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.INSTALL_DIR}}/{{.BINARY_NAME}}
      - chmod +x {{.INSTALL_DIR}}/{{.BINARY_NAME}}
      - echo "Installed{{":"}} {{.INSTALL_DIR}}/{{.BINARY_NAME}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - echo "Cleaning..."
      - rm -f {{.BUILD_DIR}}/{{.BINARY_NAME}}
